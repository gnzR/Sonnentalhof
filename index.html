<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonnental Hof — 2D Pixel-Bauernhof</title>
    <meta
      name="description"
      content="Baue Pflanzen und Pilze an, halte Tiere, handle auf dem lokalen Bauernmarkt und gestalte deinen eigenen Pixel-Bauernhof."
    />
    <meta property="og:title" content="Sonnental Hof — 2D Pixel-Bauernhof" />
    <meta
      property="og:description"
      content="Gemütliches Solo-Bauernhofspiel im Pixel-Look mit Wetter, saisonalen Events, Nachbarschaft und lokalem Spielstand."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-[#1b1612] text-[#2b2118] antialiased selection:bg-amber-300 selection:text-[#2b2118] overflow-hidden">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (ev) {
        if (ev && ev.target && (ev.target.tagName === 'SCRIPT' || ev.target.tagName === 'LINK')) {
          var targetUrl = ev.target.src || ev.target.href || ev.target.tagName;
          console.error('Asset load error:', targetUrl);
          if (ev.target.tagName === 'SCRIPT' && String(targetUrl).indexOf('/src/main.tsx') !== -1) {
            var root = document.getElementById('root');
            if (root && !root.hasChildNodes()) {
              root.innerHTML =
                '<div class="min-h-screen w-full bg-[#243d1d] flex items-center justify-center p-6 text-[#2b2118]">' +
                '<div class="max-w-md w-full bg-[#faf6ee] border-4 border-[#4a321f] rounded-2xl p-6 shadow-2xl space-y-4">' +
                '<h1 class="font-display font-bold text-xl text-[#4a321f]">Vorschau wird geladen…</h1>' +
                '<p class="text-sm text-[#5c4632]">Ein Start-Skript wurde vom Entwicklungs-Proxy blockiert oder verzögert. Ein kurzer Klick lädt die Seite sauber neu.</p>' +
                '<button id="sonnental-reload-btn" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold">Jetzt neu laden</button>' +
                '</div></div>';
              var btn = document.getElementById('sonnental-reload-btn');
              if (btn) btn.addEventListener('click', function () { window.location.reload(); });
            }
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
